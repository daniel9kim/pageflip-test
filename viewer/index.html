<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PAGE FLIP</title>
  <link rel="stylesheet" href="style.css?v=11.7.2" />
  <link rel="stylesheet" href="./episode-fix.css?v=921">
</head>
<body>
  <main id="app">
    <section id="coverView" class="view active">
      <header class="cover-topbar">
        <button class="text-btn" id="backToShelf">← 책장으로 돌아가기</button>
        <div class="eyebrow">YOUNGCHOON'S PHOTO BOOK</div>
        <button id="shareBtn" class="icon-btn" title="공유" aria-label="앨범 공유">↗</button>
      </header>

      <div class="cover-stage">
        <div class="physical-book">
          <div class="spine"></div>
          <div class="cover-photo-wrap"><img id="coverImg" src="" alt="앨범 대표 사진" /></div>
          <div class="cover-caption" id="coverTitle">앨범을 불러오는 중…</div>
          <div class="cover-date" id="coverDate"></div>
          <div class="cover-summary" id="coverSummary"></div>
          <div class="cover-meta" id="coverMeta"></div>
          <div class="story-mark" id="storyMark">✎ 그날의 기록이 있는 앨범</div>
        </div>
        <button id="openReader" class="primary-btn">▭ 책 펼치기</button>
        <div class="thumb-panel">
          <div class="thumb-strip" id="thumbStrip"></div>
        </div>
      </div>
    </section>

    <section id="readerView" class="view reader-view">
      <header class="reader-topbar">
        <button class="text-btn light" id="backToCover">← 표지로</button>
        <div>
          <strong id="readerTitle">앨범</strong>
          <span id="readerDate"></span>
        </div>
        <button id="fullscreenBtn" class="text-btn light">전체화면</button>
      </header>

      <div id="bookArea" class="book-area">
        <div id="book" class="open-book">
          <div id="spread" class="spread"></div>
          <div id="turnUnderlay" class="turn-underlay" aria-hidden="true"></div>
          <div id="turnSheet" class="turn-sheet" aria-hidden="true">
            <div class="turn-face turn-front"></div>
            <div class="turn-face turn-back"></div>
          </div>
          <div class="curl-shadow" aria-hidden="true"></div>
          <div id="pageCurl" class="page-curl" aria-hidden="true"></div>
          <button class="nav-zone prev" id="prevBtn" aria-label="이전 페이지">‹</button>
          <button class="nav-zone next" id="nextBtn" aria-label="다음 페이지">›</button>
        </div>
      </div>

      <footer class="reader-footer">
        <span id="pageIndicator">1 / 1</span>
        <span class="hint">오른쪽 아래 모서리를 드래그하거나 ← → 키를 사용하세요</span>
      </footer>
    </section>
  </main>

  <div id="storyModal" class="story-modal" role="dialog" aria-modal="true" aria-label="그날의 기록">
    <article class="story-sheet">
      <button id="storyClose" class="story-close" aria-label="닫기">×</button>
      <div class="essay-kicker">YOUNGCHOON'S NOTE</div>
      <h2>그날의 기록</h2>
      <div class="date" id="storyDate"></div>
      <p id="storyText"></p>
    </article>
  </div>

  <div id="shareToast" class="share-toast" role="status" aria-live="polite"></div>
  <div id="loadError" style="display:none;position:fixed;inset:0;z-index:9999;background:#fffdf8;padding:40px;text-align:center;color:#9b3f3f"></div>

  <script src="app.js?v=11.7.2"></script>
</body>
</html>
